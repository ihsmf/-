name: Daily AI Script

on:
  schedule:
    # Every day at 12:00 Europe/Kyiv
    - cron: "0 12 * * *"
      timezone: "Europe/Kyiv"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-send-script:
    name: Generate and send daily script

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ------------------------------------------------------
      # Get repository files
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # Generate and send script
      # ------------------------------------------------------

      - name: Run script generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python main.py
